<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8 - Barra de navegación con Flexbox</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Barra de navegación -->
    <nav class="navbar">
        <!-- Logo a la izquierda -->
        <a href="#" class="logo">MiSitio</a>

        <!-- Links a la derecha -->
        <ul class="nav-links">
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Servicios</a></li>
            <li><a href="#">Nosotros</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </nav>

    <!-- Contenido de ejemplo -->
    <main>
        <h1>Bienvenido a MiSitio</h1>
        <p>
            Esta es una barra de navegación construida con Flexbox.
            El logo está a la izquierda y los 4 links a la derecha.
        </p>
    </main>

</body>
</html>
