<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9 - Galería de productos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Nuestros productos</h1>
        <p class="subtitulo">6 productos destacados de nuestra tienda</p>
    </header>

    <main>
        <section class="galeria">

            <!-- Producto 1 -->
            <article class="card">
                <img src="https://picsum.photos/id/1/400/300" alt="Notebook plateada sobre escritorio">
                <div class="card-info">
                    <h2>Notebook Pro</h2>
                    <p class="precio">$1.250.000</p>
                    <button type="button">Comprar</button>
                </div>
            </article>

            <!-- Producto 2 -->
            <article class="card">
                <img src="https://picsum.photos/id/2/400/300" alt="Auriculares inalámbricos negros">
                <div class="card-info">
                    <h2>Auriculares BT</h2>
                    <p class="precio">$180.000</p>
                    <button type="button">Comprar</button>
                </div>
            </article>

            <!-- Producto 3 -->
            <article class="card">
                <img src="https://picsum.photos/id/3/400/300" alt="Teclado mecánico retroiluminado">
                <div class="card-info">
                    <h2>Teclado Mecánico</h2>
                    <p class="precio">$95.000</p>
                    <button type="button">Comprar</button>
                </div>
            </article>

            <!-- Producto 4 -->
            <article class="card">
                <img src="https://picsum.photos/id/4/400/300" alt="Mouse ergonómico gris">
                <div class="card-info">
                    <h2>Mouse Ergonómico</h2>
                    <p class="precio">$45.000</p>
                    <button type="button">Comprar</button>
                </div>
            </article>

            <!-- Producto 5 -->
            <article class="card">
                <img src="https://picsum.photos/id/5/400/300" alt="Monitor ultra panorámico">
                <div class="card-info">
                    <h2>Monitor UltraWide</h2>
                    <p class="precio">$680.000</p>
                    <button type="button">Comprar</button>
                </div>
            </article>

            <!-- Producto 6 -->
            <article class="card">
                <img src="https://picsum.photos/id/6/400/300" alt="Webcam Full HD con micrófono">
                <div class="card-info">
                    <h2>Webcam Full HD</h2>
                    <p class="precio">$75.000</p>
                    <button type="button">Comprar</button>
                </div>
            </article>

        </section>
    </main>

</body>
</html>
