<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 17 — Menú hamburguesa solo CSS</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="cabecera">

    <a href="#" class="cabecera__logo">Mi Sitio</a>

    <!-- 1) Checkbox oculto que guarda el estado del menú -->
    <input
      type="checkbox"
      id="menu-toggle"
      class="menu-toggle"
      aria-hidden="true">

    <!-- 2) Label asociado: es el icono "hamburguesa" clickable -->
    <label for="menu-toggle" class="menu-icono" aria-label="Abrir o cerrar menú">
      <span class="menu-icono__linea"></span>
      <span class="menu-icono__linea"></span>
      <span class="menu-icono__linea"></span>
    </label>

    <!-- 3) Menú de navegación -->
    <nav class="menu" aria-label="Navegación principal">
      <ul class="menu__lista">
        <li class="menu__item"><a href="#" class="menu__enlace">Inicio</a></li>
        <li class="menu__item"><a href="#" class="menu__enlace">Servicios</a></li>
        <li class="menu__item"><a href="#" class="menu__enlace">Proyectos</a></li>
        <li class="menu__item"><a href="#" class="menu__enlace">Blog</a></li>
        <li class="menu__item"><a href="#" class="menu__enlace">Contacto</a></li>
      </ul>
    </nav>

  </header>

  <main class="contenido">
    <h1>Ejercicio 17</h1>
    <p>Redimensiona la ventana para ver el menú hamburguesa en acción.</p>
    <p>En móvil, pulsa el icono ☰ para desplegar el menú.</p>
  </main>

</body>
</html>
